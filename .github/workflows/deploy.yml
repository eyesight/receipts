name: Deploy to Hoststar

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: receipts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build Astro
        run: pnpm build

      - name: Deploy to Hoststar via SFTP
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          cat > /tmp/lftp-script.txt << 'EOF'
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -oHostKeyAlgorithms=+ssh-rsa,ssh-dss -oKexAlgorithms=+diffie-hellman-group14-sha1"
          set net:timeout 30
          set net:max-retries 2
          set mirror:parallel-transfer-count 4
          EOF
          echo "open sftp://${FTP_USERNAME}:${FTP_PASSWORD}@${FTP_SERVER}:5544" >> /tmp/lftp-script.txt
          echo "lcd apps/web/dist" >> /tmp/lftp-script.txt
          echo "mirror -R --delete ." >> /tmp/lftp-script.txt
          echo "quit" >> /tmp/lftp-script.txt
          lftp -f /tmp/lftp-script.txt
